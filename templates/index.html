<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineMatch - Recommender Engine</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .card { border: 1px solid #ddd; padding: 12px; margin-bottom: 8px; border-radius: 6px; }
        button { padding: 8px 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🎬 CineMatch Recommender</h1>
    <label for="userSelect">Select User ID:</label>
    <select id="userSelect">
        {% for u in users %}
            <option value="{{ u }}">User #{{ u }}</option>
        {% endfor %}
    </select>
    <button onclick="fetchRecommendations()">Get Recommendations</button>

    <h2 style="margin-top: 30px;">Top Recommendations:</h2>
    <div id="results"><i>Click button to generate recommendations...</i></div>

    <script>
        async function fetchRecommendations() {
            const userId = document.getElementById('userSelect').value;
            const container = document.getElementById('results');
            container.innerHTML = "Loading...";

            const res = await fetch(`/api/recommend?user_id=${userId}&top_n=5`);
            const data = await res.json();
            
            container.innerHTML = "";
            data.recommendations.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<strong>${item.title}</strong> — Predicted Rating: ⭐️ ${item.score}`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
